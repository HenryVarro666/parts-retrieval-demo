<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="505" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
<title id="title">Local architecture &amp; evidence boundaries</title><desc id="desc">Browser, local Python service, frozen data and isolated optional model boundary</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="505" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">Local architecture &amp; evidence boundaries</text><rect x="28" y="83" width="292" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="46" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Evidence workbench</text><text x="46" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">HTML / CSS / JavaScript</text><text x="46" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">中文 / English / Español</text><text x="46" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Saved playback versus live inference</text><rect x="398" y="83" width="324" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="416" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Local HTTP service</text><text x="416" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Python standard-library server</text><text x="416" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Catalog/provenance checks · Lazy models</text><text x="416" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Temporary uploads, outside the dataset</text><rect x="800" y="83" width="294" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="818" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Frozen public evidence</text><text x="818" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Catalog SQLite + JSON / CSV</text><text x="818" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Sources/licenses, OCR/model outputs</text><text x="818" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Labels for scoring, not inference</text><path d="M325,165 L388,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M727,165 L790,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="300" width="510" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="46" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Per-view retrieval &amp; fusion</text><text x="46" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">RapidOCR / EasyOCR · SigLIP · SQLite · NumPy</text><text x="46" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Shape availability · Fixed RRF · Conflicts and evidence retained</text><rect x="584" y="300" width="510" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="602" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">Isolated optional VLM environment</text><text x="602" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Qwen3-VL-4B · MLX · Apple Silicon</text><text x="602" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Joint views + shuffled references; abstain or retain original ranking</text><path d="M504,253 L282,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M614,253 L839,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="478" font-size="13" fill="#678077" font-weight="400" text-anchor="start">No training or external inference API. Uploads/weights/runtime caches stay out of Git; attributed public evaluation data are included.</text></g></svg>
