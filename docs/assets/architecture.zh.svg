<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="505" viewBox="0 0 1120 505" role="img" aria-labelledby="title desc">
<title id="title">本地架构与证据边界</title><desc id="desc">Browser, local Python service, frozen data and isolated optional model boundary</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="505" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">本地架构与证据边界</text><rect x="28" y="83" width="292" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="46" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">证据网页</text><text x="46" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">HTML / CSS / JavaScript</text><text x="46" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">中文 / English / Español</text><text x="46" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">回放与实时推理明确分开</text><rect x="398" y="83" width="324" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="416" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">本地 HTTP 服务</text><text x="416" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Python standard-library server</text><text x="416" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">目录/来源校验 · 模型延迟载入</text><text x="416" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">临时上传图，不写入评估数据</text><rect x="800" y="83" width="294" height="165" rx="14" fill="#fff" stroke="#d7e3da"/><text x="818" y="116" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">冻结的公开证据</text><text x="818" y="148" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Catalog SQLite + JSON / CSV</text><text x="818" y="173" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">来源/许可 · OCR/模型输出 · 结果</text><text x="818" y="198" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">标签仅评分，不进入推理</text><path d="M325,165 L388,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M727,165 L790,165" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="300" width="510" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="46" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">逐图检索与融合</text><text x="46" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">RapidOCR / EasyOCR · SigLIP · SQLite · NumPy</text><text x="46" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">形状未知可用性 · 固定 RRF · 冲突与来源保留</text><rect x="584" y="300" width="510" height="140" rx="14" fill="#e9f1e9" stroke="#d7e3da"/><text x="602" y="333" font-size="18" fill="#244a45" font-weight="650" text-anchor="start">独立的可选 VLM 环境</text><text x="602" y="365" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">Qwen3-VL-4B · MLX · Apple Silicon</text><text x="602" y="390" font-size="13" fill="#59756a" font-weight="400" text-anchor="start">联合多图 + 打乱的参考图；可弃权，失败保留原排序</text><path d="M504,253 L282,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><path d="M614,253 L839,289" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="478" font-size="13" fill="#678077" font-weight="400" text-anchor="start">没有训练或外部推理 API；上传、模型权重与运行缓存不入 Git；公开评估数据带署名入库。</text></g></svg>
