<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
<title id="title">From part photos to inspectable candidates</title><desc id="desc">Local photo retrieval workflow with optional visual verification, no evaluation-label input</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="369" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">From part photos to inspectable candidates</text><text x="32" y="73" font-size="13" fill="#678077" font-weight="400" text-anchor="start">Catalog fields are inference inputs; evaluation labels are scoring-only</text><rect x="28" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="46" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">01</text><text x="46" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">One part · 1–3 photos</text><text x="46" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">Keep raw OCR text and boxes per view</text><text x="46" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">Near-duplicate groups share a vote</text><path d="M278,191 L296,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="302" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="320" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">02</text><text x="320" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">Keyword retrieval</text><text x="320" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">RapidOCR → SQLite / FTS5</text><text x="320" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">SigLIP adds appearance candidates</text><path d="M552,191 L570,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="594" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">03</text><text x="594" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">Shape &amp; rank fusion</text><text x="594" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">Use reliable shape as a soft cue</text><text x="594" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">Fixed RRF · At most 10 candidates</text><path d="M826,191 L844,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="868" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">04</text><text x="868" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">Optional visual check</text><text x="868" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">Strong-ID gate / joint Qwen-VL</text><text x="868" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">Choose within pool or abstain</text><rect x="28" y="301" width="1066" height="44" rx="8" fill="#e4efe6" stroke="none"/><text x="48" y="328" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">Inspect OCR, SQL hits, candidate origins, raw model reasoning and timing. Ranking scores are not probabilities.</text></g></svg>
