<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="369" viewBox="0 0 1120 369" role="img" aria-labelledby="title desc">
<title id="title">从元件照片到可检查的候选</title><desc id="desc">Local photo retrieval workflow with optional visual verification, no evaluation-label input</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#72a18b"/></marker></defs>
<rect width="1120" height="369" rx="20" fill="#f4f7f1"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif"><text x="32" y="45" font-size="25" fill="#244a45" font-weight="650" text-anchor="start">从元件照片到可检查的候选</text><text x="32" y="73" font-size="13" fill="#678077" font-weight="400" text-anchor="start">目录信息用于推理，评估标签只用于评分</text><rect x="28" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="46" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">01</text><text x="46" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">同一元件 · 1–3 张照片</text><text x="46" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">逐图保留 OCR 原文与文字框</text><text x="46" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">近重复照片共享一票</text><path d="M278,191 L296,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="302" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="320" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">02</text><text x="320" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">多关键词召回</text><text x="320" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">RapidOCR → SQLite / FTS5</text><text x="320" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">SigLIP 补充外观候选</text><path d="M552,191 L570,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="576" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="594" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">03</text><text x="594" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">形状与多图排名融合</text><text x="594" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">形状可靠时作软提示</text><text x="594" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">固定 RRF · 候选不超过 10</text><path d="M826,191 L844,191" fill="none" stroke="#72a18b" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="106" width="246" height="173" rx="14" fill="#fff" stroke="#d7e3da"/><text x="868" y="138" font-size="14" fill="#21836c" font-weight="650" text-anchor="start">04</text><text x="868" y="173" font-size="17" fill="#244a45" font-weight="650" text-anchor="start">可选视觉核验</text><text x="868" y="213" font-size="12" fill="#244a45" font-weight="400" text-anchor="start">强型号门控 / 联合 Qwen-VL</text><text x="868" y="248" font-size="12" fill="#678077" font-weight="400" text-anchor="start">候选内选择或弃权 · 留依据</text><rect x="28" y="301" width="1066" height="44" rx="8" fill="#e4efe6" stroke="none"/><text x="48" y="328" font-size="14" fill="#244a45" font-weight="400" text-anchor="start">观察文字、SQL 命中、候选来源、模型原文与计时一起展示；排名分数不是正确概率。</text></g></svg>
