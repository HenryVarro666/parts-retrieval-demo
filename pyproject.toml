[project]
name = "partsid"
version = "0.1.0"
description = "Identify an electronic part from a photo with OCR plus three retrieval channels, measured on a small labelled set"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
experiments = [
    "onnxruntime==1.31.1",
    "rapidocr==3.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13,<1"]

# On Linux / Windows pull CUDA builds of torch (cu132 includes Blackwell sm_120,
# e.g. RTX 5080); macOS keeps the PyPI wheels with MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partsid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:partsid.*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", "results", "docs", "experiments", ".venv-vlm"]

[tool.ruff.lint]
# Explicit rule set so results do not drift with ruff's defaults.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
  "B905",  # zip(strict=) would change behavior in evidence-generating code paths.
  "E701", "E702", "E731",  # Compact one-line style is used deliberately in experiment runners.
]
