[project]
name = "partsid"
version = "0.1.0"
description = "Identify an electronic part from a photo with OCR plus three retrieval channels, measured on a small labelled set"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.46",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "easyocr>=1.7.2",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
experiments = [
    "onnxruntime==1.31.1",
    "rapidocr==3.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# On Linux / Windows pull CUDA builds of torch (cu132 includes Blackwell sm_120,
# e.g. RTX 5080); macOS keeps the PyPI wheels with MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partsid"]
